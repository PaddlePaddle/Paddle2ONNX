name: MacRelease

on:
  release:
    types: [published]

# Use MACOSX_DEPLOYMENT_TARGET=12.0 to produce compatible wheel
env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: [ '3.8', '3.9', '3.10', '3.11', '3.12']
        architecture: [ 'arm64' ]

    steps:
      # Checkout the latest branch of Paddle2ONNX.
      - name: Checkout Paddle2ONNX
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      # Setup Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # Clone protobuf repository and checkout v21.12
      - name: Clone protobuf
        run: |
          git clone https://github.com/protocolbuffers/protobuf.git
          cd protobuf
          git checkout v21.12

      # Build and install protobuf
      - name: Build and install protobuf
        run: |
          cd protobuf
          git submodule update --init --recursive
          mkdir build
          cd build
          cmake ../cmake -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/installed_protobuf -Dprotobuf_BUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -Dprotobuf_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=14
          cmake --build . --target install

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install "build==1.2.2.post1"

      # Build package
      - name: Build package
        run: |
          export PATH="${{ github.workspace }}/installed_protobuf/bin:$PATH"
          export PIP_EXTRA_INDEX_URL="https://www.paddlepaddle.org.cn/packages/nightly/cpu/"
          python -m build --wheel

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6
        with:
          name: MacRelease_${{ matrix.architecture }}_py${{ matrix.python-version }}
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paddle2onnx
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: MacRelease_*
          path: dist
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
